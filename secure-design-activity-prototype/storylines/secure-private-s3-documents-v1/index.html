ink, Security proves valid credentials still work from the wrong network, Operations overwrites a signed contract, and an audit-policy change is forgotten. Secure the same evolving document vault through each incident.\",\"audience\":\"Developers and cloud practitioners with basic AWS familiarity\",\"focus\":\"VPC-restricted private document storage\",\"topic\":\"AWS · S3\",\"estimatedMinutes\":{\"min\":35,\"max\":45},\"chapters\":[{\"id\":\"shared-link\",\"title\":\"The shared link\",\"summary\":\"A contractor receives a raw object URL. Deny anonymous access while preserving Northstar's approved employee path.\",\"estimatedMinutes\":8,\"introducedComponentTypeIds\":[\"external-actor\",\"employee\",\"iam-identity-center\",\"documents-role\",\"s3-account-public-access-block\",\"s3-documents-bucket\"],\"requiredProbeIds\":[\"PROBE-S3-101\"],\"introduction\":{\"eyebrow\":\"Chapter 1 · The shared link\",\"title\":\"A contractor should not be able to open this URL\",\"body\":\"Northstar's Operations team has started storing contracts, policies, and internal reports in S3. During the pilot, a contractor receives a raw object link in a forwarded message. The request can reach the S3 service, but it must receive AccessDenied. Approved employees still need one deliberate identity route.\",\"inlineCodeTerms\":[\"AccessDenied\"],\"highlights\":[\"Reject the anonymous object request\",\"Layer account- and bucket-level guardrails\",\"Preserve temporary workforce access\"]},\"debrief\":{\"eyebrow\":\"Incident 1 contained\",\"title\":\"The shared link now returns AccessDenied\",\"body\":\"The contractor's request still reaches S3, but account- and bucket-level Block Public Access, ACL-disabled ownership, and scoped authorization prevent retrieval. Northstar employees use temporary federated credentials through one role, with bucket and object actions separated.\",\"inlineCodeTerms\":[\"AccessDenied\"],\"highlights\":[\"Anonymous access denied\",\"No long-lived employee keys\",\"The bucket is not yet network-restricted\"]},\"challenge\":{\"schemaVersion\":\"1.0\",\"id\":\"secure-private-s3-documents-access-v1\",\"eyebrow\":\"S3 storyline chapter\",\"title\":\"Chapter 1: Stop the shared link\",\"shortTitle\":\"Stop the shared link\",\"summary\":\"Reject a contractor's anonymous S3 link while preserving one federated, least-privilege employee path.\",\"topic\":\"AWS · S3\",\"canvasTitle\":\"Secure the private document store\",\"canvasDescription\":\"Make unauthenticated retrieval fail with AccessDenied while preserving a deliberate employee access path.\",\"description\":\"Northstar's Operations team quickly moved contracts, policies, and internal reports into S3. During the pilot, a contractor receives a raw object link that should never provide anonymous access.\",\"objective\":\"Make unauthenticated retrieval fail with AccessDenied while preserving a deliberate employee access path.\",\"requirements\":[\"Apply S3 Block Public Access at both account and bucket level, then disable ACL-based ownership with Bucket owner enforced Object Ownership.\",\"Verify S3's default SSE-S3 encryption baseline and require TLS.\",\"Use IAM Identity Center and a least-privilege documents role with separate bucket and object permissions.\"],\"constraints\":[\"The bucket stores private company documents; anonymous access is never required.\",\"An internet request can still reach the S3 service endpoint; authorization must reject it with AccessDenied.\",\"Employees receive s3:ListBucket plus scoped s3:GetObject and s3:PutObject; deletion remains a separate business decision.\"],\"dataTypes\":[{\"label\":\"Private company document\",\"value\":\"private-document\"},{\"label\":\"Workforce identity\",\"value\":\"workforce-identity\"},{\"label\":\"Network origin\",\"value\":\"network-origin\"},{\"label\":\"KMS key use\",\"value\":\"kms-key-use\"},{\"label\":\"Object access event\",\"value\":\"object-access-event\"},{\"label\":\"Security finding\",\"value\":\"security-finding\"}],\"componentCatalog\":[{\"typeId\":\"external-actor\",\"label\":\"External internet user\",\"description\":\"An unauthenticated person attempting to retrieve a private company document.\",\"category\":\"People\",\"iconKey\":\"warning\",\"defaultProperties\":{},\"propertyFields\":[],\"tags\":[\"actor\",\"internet\",\"threat\"],\"capabilities\":[]},{\"typeId\":\"employee\",\"label\":\"Company employee\",\"description\":\"An employee who needs approved access to the private document bucket.\",\"category\":\"People\",\"iconKey\":\"person\",\"defaultProperties\":{},\"propertyFields\":[],\"tags\":[\"actor\",\"workforce\"],\"capabilities\":[]},{\"typeId\":\"iam-identity-center\",\"label\":\"IAM Identity Center\",\"description\":\"Federates workforce identity and issues temporary AWS credentials.\",\"category\":\"Identity \u0026 access\",\"iconKey\":\"identity\",\"defaultProperties\":{\"mfaRequired\":false,\"temporaryCredentials\":false},\"propertyFields\":[{\"key\":\"mfaRequired\",\"label\":\"Require MFA\",\"description\":\"Require a second factor for employee access.\",\"type\":\"boolean\"},{\"key\":\"temporaryCredentials\",\"label\":\"Issue temporary credentials\",\"description\":\"Use short-lived federated sessions instead of long-lived IAM user keys.\",\"type\":\"boolean\"}],\"tags\":[\"identity\",\"workforce\"],\"capabilities\":[]},{\"typeId\":\"documents-role\",\"label\":\"Private documents IAM role\",\"description\":\"Separates bucket-level, object-level, deletion, and KMS permissions for approved employees.\",\"category\":\"Identity \u0026 access\",\"iconKey\":\"key\",\"defaultProperties\":{\"accessScope\":\"bucket-admin\",\"listBucket\":false,\"getObject\":false,\"putObject\":false,\"deleteObject\":false,\"kmsGenerateDataKey\":false,\"kmsDecrypt\":false},\"propertyFields\":[{\"key\":\"accessScope\",\"label\":\"Access scope\",\"description\":\"Choose the smallest useful permission set.\",\"type\":\"select\",\"options\":[{\"label\":\"Bucket administrator\",\"value\":\"bucket-admin\"},{\"label\":\"Read and write company documents\",\"value\":\"documents-readwrite\"},{\"label\":\"Read company documents\",\"value\":\"documents-readonly\"}]},{\"key\":\"listBucket\",\"label\":\"Allow s3:ListBucket\",\"description\":\"List keys at the bucket resource ARN.\",\"type\":\"boolean\"},{\"key\":\"getObject\",\"label\":\"Allow s3:GetObject\",\"description\":\"Read objects under the approved object ARN prefix.\",\"type\":\"boolean\"},{\"key\":\"putObject\",\"label\":\"Allow s3:PutObject\",\"description\":\"Upload objects under the approved object ARN prefix.\",\"type\":\"boolean\"},{\"key\":\"deleteObject\",\"label\":\"Allow s3:DeleteObject\",\"description\":\"Treat deletion as a separate business decision instead of bundling it into read/write access.\",\"type\":\"boolean\"},{\"key\":\"kmsGenerateDataKey\",\"label\":\"Allow kms:GenerateDataKey\",\"description\":\"Let S3 create data keys for approved SSE-KMS uploads with the documents key.\",\"type\":\"boolean\"},{\"key\":\"kmsDecrypt\",\"label\":\"Allow kms:Decrypt\",\"description\":\"Let approved readers decrypt SSE-KMS objects with the documents key.\",\"type\":\"boolean\"}],\"tags\":[\"authorization\",\"least-privilege\"],\"capabilities\":[]},{\"typeId\":\"s3-account-public-access-block\",\"label\":\"Account-level S3 Block Public Access\",\"description\":\"Applies all four S3 Block Public Access settings across the account; an organization policy can enforce the same baseline centrally.\",\"category\":\"Security controls\",\"iconKey\":\"security\",\"defaultProperties\":{\"blockAllPublicAccess\":false},\"propertyFields\":[{\"key\":\"blockAllPublicAccess\",\"label\":\"Block all public access for the account\",\"description\":\"Enable all four account-level S3 Block Public Access settings.\",\"type\":\"boolean\"}],\"tags\":[\"guardrail\",\"public-access\",\"account-level\"],\"capabilities\":[]},{\"typeId\":\"s3-documents-bucket\",\"label\":\"Private company documents bucket\",\"description\":\"The Amazon S3 general purpose bucket that stores internal company documents.\",\"category\":\"Storage\",\"iconKey\":\"storage\",\"defaultProperties\":{\"publicAccess\":true,\"blockPublicAccess\":false,\"objectOwnership\":\"object-writer\",\"requireTls\":false,\"defaultEncryption\":\"none\",\"bucketKeyEnabled\":false,\"versioningEnabled\":false,\"objectLockEnabled\":false,\"retentionMode\":\"none\"},\"propertyFields\":[{\"key\":\"publicAccess\",\"label\":\"Allow public access\",\"description\":\"Allow policies or ACLs to expose documents publicly.\",\"type\":\"boolean\"},{\"key\":\"blockPublicAccess\",\"label\":\"Bucket: block all public access\",\"description\":\"Enable every bucket-level S3 Block Public Access setting in addition to the account baseline.\",\"type\":\"boolean\"},{\"key\":\"objectOwnership\",\"label\":\"Object Ownership\",\"description\":\"Choose how ownership and ACLs are handled.\",\"type\":\"select\",\"options\":[{\"label\":\"Object writer\",\"value\":\"object-writer\"},{\"label\":\"Bucket owner preferred\",\"value\":\"bucket-owner-preferred\"},{\"label\":\"Bucket owner enforced — ACLs disabled\",\"value\":\"bucket-owner-enforced\"}]},{\"key\":\"requireTls\",\"label\":\"Require TLS\",\"description\":\"Deny requests when aws:SecureTransport is false.\",\"type\":\"boolean\"},{\"key\":\"defaultEncryption\",\"label\":\"Default encryption\",\"description\":\"Choose how new objects are encrypted at rest.\",\"type\":\"select\",\"options\":[{\"label\":\"No declared encryption\",\"value\":\"none\"},{\"label\":\"SSE-S3\",\"value\":\"sse-s3\"},{\"label\":\"SSE-KMS\",\"value\":\"sse-kms\"}]},{\"key\":\"bucketKeyEnabled\",\"label\":\"Use an S3 Bucket Key\",\"description\":\"Reduce AWS KMS request traffic for SSE-KMS objects.\",\"type\":\"boolean\"},{\"key\":\"versioningEnabled\",\"label\":\"Enable versioning\",\"description\":\"Preserve earlier object versions for recovery.\",\"type\":\"boolean\"},{\"key\":\"objectLockEnabled\",\"label\":\"Enable Object Lock\",\"description\":\"Protect retained versions from deletion.\",\"type\":\"boolean\"},{\"key\":\"retentionMode\",\"label\":\"Default retention\",\"description\":\"Choose a default Object Lock retention mode.\",\"type\":\"select\",\"options\":[{\"label\":\"No default retention\",\"value\":\"none\"},{\"label\":\"30-day governance retention\",\"value\":\"governance-30-days\"},{\"label\":\"30-day compliance retention\",\"value\":\"compliance-30-days\"}]}],\"tags\":[\"storage\",\"documents\",\"sensitive-data\"],\"capabilities\":[]}],\"connectionFields\":[{\"key\":\"protocol\",\"label\":\"Protocol\",\"description\":\"The protocol or trust mechanism used for this relationship.\",\"type\":\"select\",\"options\":[{\"label\":\"HTTPS / TLS\",\"value\":\"https\"},{\"label\":\"SAML / OIDC\",\"value\":\"federation\"},{\"label\":\"AWS API\",\"value\":\"aws-api\"},{\"label\":\"S3 VPC endpoint\",\"value\":\"vpc-endpoint\"},{\"label\":\"KMS key use\",\"value\":\"kms\"},{\"label\":\"Security telemetry\",\"value\":\"telemetry\"},{\"label\":\"Security event\",\"value\":\"event\"}]},{\"key\":\"encrypted\",\"label\":\"Encrypted in transit\",\"description\":\"Protect information while it crosses this connection.\",\"type\":\"boolean\"},{\"key\":\"authenticated\",\"label\":\"Authenticated\",\"description\":\"Require a trusted AWS or workforce identity for this connection.\",\"type\":\"boolean\"},{\"key\":\"authorizationOutcome\",\"label\":\"Authorization outcome\",\"description\":\"Show whether the destination authorizes the request or returns AccessDenied.\",\"type\":\"select\",\"options\":[{\"label\":\"Allowed\",\"value\":\"allowed\"},{\"label\":\"Denied (AccessDenied)\",\"value\":\"denied\"}]}],\"boundaryCatalog\":[{\"kind\":\"company-aws-account\",\"label\":\"Company AWS account\",\"description\":\"The AWS account boundary that contains the private document controls and evidence paths.\",\"defaultWidth\":1450,\"defaultHeight\":720}],\"rules\":[{\"id\":\"S3-101\",\"title\":\"Public access is blocked at account and bucket level\",\"severity\":\"error\",\"explanation\":\"Layered S3 Block Public Access settings keep a future bucket policy or ACL change from silently exposing documents.\",\"remediation\":\"Enable all four account-level and bucket-level Block Public Access settings, disable public access, and use Bucket owner enforced Object Ownership so ACLs are disabled.\",\"hintPriority\":10,\"condition\":{\"kind\":\"all\",\"conditions\":[{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"s3-documents-bucket\"]},\"property\":\"publicAccess\",\"predicate\":{\"operator\":\"falsy\"},\"requireMatch\":true},{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"s3-documents-bucket\"]},\"property\":\"blockPublicAccess\",\"predicate\":{\"operator\":\"truthy\"},\"requireMatch\":true},{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"s3-documents-bucket\"]},\"property\":\"objectOwnership\",\"predicate\":{\"operator\":\"equals\",\"value\":\"bucket-owner-enforced\"},\"requireMatch\":true},{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"s3-account-public-access-block\"]},\"property\":\"blockAllPublicAccess\",\"predicate\":{\"operator\":\"truthy\"},\"requireMatch\":true}]}},{\"id\":\"S3-102\",\"title\":\"S3's encryption baseline is verified and TLS is required\",\"severity\":\"error\",\"explanation\":\"S3 already encrypts every new object with SSE-S3 by default. The design verifies that baseline and rejects plaintext HTTP requests.\",\"remediation\":\"Record SSE-S3 or SSE-KMS as the verified bucket default and require aws:SecureTransport in the bucket policy.\",\"hintPriority\":20,\"condition\":{\"kind\":\"all\",\"conditions\":[{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"s3-documents-bucket\"]},\"property\":\"defaultEncryption\",\"predicate\":{\"operator\":\"oneOf\",\"values\":[\"sse-s3\",\"sse-kms\"]},\"requireMatch\":true},{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"s3-documents-bucket\"]},\"property\":\"requireTls\",\"predicate\":{\"operator\":\"truthy\"},\"requireMatch\":true}]}},{\"id\":\"S3-103\",\"title\":\"Employee access uses temporary federated identity\",\"severity\":\"error\",\"explanation\":\"Long-lived IAM user keys are unnecessary for routine workforce access and are harder to rotate safely.\",\"remediation\":\"Require MFA and temporary sessions through IAM Identity Center.\",\"hintPriority\":30,\"condition\":{\"kind\":\"all\",\"conditions\":[{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"iam-identity-center\"]},\"property\":\"mfaRequired\",\"predicate\":{\"operator\":\"truthy\"},\"requireMatch\":true},{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"iam-identity-center\"]},\"property\":\"temporaryCredentials\",\"predicate\":{\"operator\":\"truthy\"},\"requireMatch\":true}]}},{\"id\":\"S3-104\",\"title\":\"Bucket, object, and deletion permissions are separated\",\"severity\":\"error\",\"explanation\":\"s3:ListBucket applies to the bucket ARN, object actions apply to object ARNs, and deletion should be a separate business decision.\",\"remediation\":\"Allow ListBucket plus GetObject and PutObject only for the approved bucket and prefix; leave DeleteObject disabled unless the business explicitly requires it.\",\"hintPriority\":40,\"condition\":{\"kind\":\"all\",\"conditions\":[{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"documents-role\"]},\"property\":\"accessScope\",\"predicate\":{\"operator\":\"equals\",\"value\":\"documents-readwrite\"},\"requireMatch\":true},{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"documents-role\"]},\"property\":\"listBucket\",\"predicate\":{\"operator\":\"truthy\"},\"requireMatch\":true},{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"documents-role\"]},\"property\":\"getObject\",\"predicate\":{\"operator\":\"truthy\"},\"requireMatch\":true},{\"kind\":\"componentProperty\",\"selector\":{\"typeIds\":[\"documents-role\"]},\"propert y for an external audit and forgets to restore it. Priya needs to know whether the change created unintended access, which objects were touched, and whether the signal reached a human responder.\",\"highlights\":[\"CloudTrail object data events\",\"Access Analyzer and Macie findings\",\"EventBridge response routing\"]},\"debrief\":{\"eyebrow\":\"Incident 4 detected\",\"title\":\"The forgotten change now creates an actionable signal\",\"body\":\"CloudTrail records object access, IAM Access Analyzer identifies public or unintended cross-account grants, and Macie reports sensitive-data and policy findings. EventBridge carries the important signal to Priya's Security on-call destination.\",\"highlights\":[\"Object access is attributable\",\"Exposure is continuously analyzed\",\"Findings reach a responder\"]},\"challenge\":{\"schemaVersion\":\"1.0\",\"id\":\"secure-private-s3-documents-monitoring-v1\",\"eyebrow\":\"S3 storyline chapter\",\"title\":\"Chapter 4: Detect risky access and changes\",\"shortTitle\":\"Detect risky access and changes\",\"summary\":\"Detect a forgotten audit-policy change and turn document access into evidence and actionable findings.\",\"topic\":\"AWS · S3\",\"canvasTitle\":\"Secure the private document store\",\"canvasDescription\":\"Turn bucket activity and posture changes into evidence and a monitored response path.\",\"description\":\"A month later, an administrator temporarily changes the bucket policy for an external audit and forgets to restore it. Priya needs to know whether the change created unintended access, which objects were touched, and whether the signal reached a responder.\",\"objective\":\"Turn bucket activity and posture changes into evidence and a monitored response path.\",\"requirements\":[\"Record object-level S3 data events in an ongoing CloudTrail trail.\",\"Analyze unintended public or cross-account access and discover sensitive data with managed AWS services.\",\"Route the resulting findings through EventBridge to Secu
